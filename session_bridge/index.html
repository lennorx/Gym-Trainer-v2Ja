<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// Pod Streamlit <-> localStorage (portat din Profesor ETTI).
// Citește ID-ul conversației și tokenul „ține-mă minte” salvate în acest browser și le TRIMITE spre
// Python prin protocolul Streamlit (postMessage). NU navighează pagina: iframe-urile componentelor
// sunt izolate (sandbox), iar Chrome/Edge blochează orice redirect al paginii-părinte făcut din ele.
(function () {
  var SID_KEY = "gymbro_session_id";
  var TOKEN_KEY = "gymbro_auth_token";
  var sent = false;
  var TARGET = window.location.origin;

  function post(type, extra) {
    var msg = { isStreamlitMessage: true, type: type };
    for (var k in extra) { msg[k] = extra[k]; }
    window.parent.postMessage(msg, TARGET);
  }

  function readStorage() {
    var out = { sid: "", token: "", storage: true };
    try {
      out.sid = localStorage.getItem(SID_KEY) || "";
      out.token = localStorage.getItem(TOKEN_KEY) || "";
    } catch (e) {
      out.storage = false;  // stocare blocată (mod privat / setări stricte)
    }
    return out;
  }

  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "streamlit:render" || sent) { return; }
    sent = true;
    post("streamlit:setComponentValue", { value: readStorage(), dataType: "json" });
  });

  post("streamlit:componentReady", { apiVersion: 1 });
  post("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body>
</html>
